<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <!-- Summit O'ahu Logo Concept 2: Circular Badge / Emblem Style -->

  <!-- Outer circle -->
  <circle cx="55" cy="55" r="48" fill="none" stroke="#2d4d22" stroke-width="2"/>
  <circle cx="55" cy="55" r="44" fill="none" stroke="#d4a45e" stroke-width="0.5" opacity="0.6"/>

  <!-- Mountain inside circle -->
  <path d="M25 72 L40 38 L48 48 L55 28 L62 48 L70 38 L85 72 Z" fill="#2d4d22"/>

  <!-- Ocean waves -->
  <path d="M22 74 Q30 70 38 74 Q46 78 55 74 Q63 70 71 74 Q79 78 88 74" stroke="#3494a5" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M25 79 Q33 75 41 79 Q49 83 57 79 Q65 75 73 79 Q81 83 85 79" stroke="#3494a5" stroke-width="1" fill="none" opacity="0.5" stroke-linecap="round"/>

  <!-- Sun -->
  <circle cx="68" cy="32" r="5" fill="#d4a45e"/>

  <!-- Curved text around top -->
  <defs>
    <path id="topArc" d="M15 55 A40 40 0 0 1 95 55"/>
    <path id="bottomArc" d="M20 65 A38 38 0 0 0 90 65"/>
  </defs>
  <text font-family="'Inter', Helvetica, sans-serif" font-size="7" font-weight="700" fill="#2d4d22" letter-spacing="3">
    <textPath href="#topArc" startOffset="12%">SUMMIT O'AHU</textPath>
  </text>
  <text font-family="'Inter', Helvetica, sans-serif" font-size="5.5" font-weight="500" fill="#6f6762" letter-spacing="2">
    <textPath href="#bottomArc" startOffset="9%">EST. 2024 • HAWAI'I</textPath>
  </text>

  <!-- Right side text -->
  <text x="125" y="42" font-family="Georgia, 'Playfair Display', serif" font-size="32" font-weight="700" fill="#1a3a1a" letter-spacing="-0.5">Summit</text>
  <text x="265" y="42" font-family="Georgia, 'Playfair Display', serif" font-size="32" font-weight="300" fill="#c48d48" font-style="italic">O'ahu</text>
  <line x1="125" y1="52" x2="340" y2="52" stroke="#d4a45e" stroke-width="0.5" opacity="0.4"/>
  <text x="125" y="66" font-family="'Inter', Helvetica, sans-serif" font-size="9" font-weight="600" fill="#6f6762" letter-spacing="3.5">PREMIUM CIRCLE ISLAND TOURS</text>

  <!-- Small decorative elements -->
  <text x="125" y="86" font-family="Georgia, serif" font-size="11" fill="#5a9a3e" opacity="0.4">✦</text>
  <text x="160" y="86" font-family="'Inter', sans-serif" font-size="8" fill="#8a827d" letter-spacing="1">Experience the Spirit of Hawai'i</text>
  <text x="340" y="86" font-family="Georgia, serif" font-size="11" fill="#5a9a3e" opacity="0.4">✦</text>
</svg>
