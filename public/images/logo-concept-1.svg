<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <!-- Summit O'ahu Logo Concept 1: Mountain Peak + Palm Frond -->

  <!-- Mountain peak icon -->
  <g transform="translate(10, 10)">
    <!-- Mountain silhouette -->
    <path d="M50 85 L25 45 L15 55 L0 85 Z" fill="#365f26" opacity="0.6"/>
    <path d="M45 85 L55 30 L65 50 L80 20 L95 85 Z" fill="#2d4d22"/>

    <!-- Gold sun/horizon line -->
    <circle cx="80" cy="25" r="8" fill="#d4a45e" opacity="0.8"/>

    <!-- Palm frond accent -->
    <path d="M88 40 Q95 30 105 28 Q95 33 90 42" fill="#5a9a3e" opacity="0.7"/>
    <path d="M90 43 Q100 35 112 35 Q100 40 92 48" fill="#437a2d" opacity="0.6"/>
  </g>

  <!-- Text -->
  <text x="130" y="55" font-family="Georgia, 'Playfair Display', serif" font-size="38" font-weight="700" fill="#1a3a1a" letter-spacing="-0.5">Summit</text>
  <text x="295" y="55" font-family="Georgia, 'Playfair Display', serif" font-size="38" font-weight="300" fill="#c48d48" letter-spacing="-0.5" font-style="italic">O'ahu</text>

  <!-- Tagline -->
  <text x="130" y="78" font-family="'Inter', Helvetica, sans-serif" font-size="10" font-weight="600" fill="#6f6762" letter-spacing="4">PREMIUM CIRCLE ISLAND TOURS</text>

  <!-- Decorative line -->
  <line x1="130" y1="88" x2="370" y2="88" stroke="#d4a45e" stroke-width="0.5" opacity="0.5"/>
</svg>
